name: Generate Snake and Stats

on:
  schedule:
    # Runs every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/generate-snake.yml"
      - ".github/scripts/**"

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. Setup directories
      - name: Ensure assets directory exists
        run: mkdir -p assets

      # 2. Generate Contribution Snake (Monochrome)
      - name: Generate Contribution Grid Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/github-contribution-grid-snake.svg?color_snake=%231a1a1a&color_dots=%23ebedf0,%23c0c0c0,%23888888,%23444444,%231a1a1a
            assets/github-contribution-grid-snake-dark.svg?color_snake=white&color_dots=%23161b22,%232a2a2a,%23555555,%23888888,%23d4d4d4
          github_token: ${{ secrets.PERSONAL_TOKEN }}

      # 3. Generate Streak Stats (Dark)
      - name: Generate Streak Stats Card (Dark)
        uses: be-next/github-streak-stats-action@v1
        with:
          username: ${{ github.repository_owner }}
          token: ${{ secrets.PERSONAL_TOKEN }}
          output-path: assets/github-streak-stats-dark.svg
          background: "0a0a0a"
          stroke: "3a3a3a"
          ring: "a0a0a0"
          fire: "d4d4d4"
          currStreakNum: "d4d4d4"
          sideNums: "a0a0a0"
          currStreakLabel: "a0a0a0"
          sideLabels: "6b6b6b"
          dates: "6b6b6b"
          hide-border: false

      # 3b. Generate Streak Stats (Light)
      - name: Generate Streak Stats Card (Light)
        uses: be-next/github-streak-stats-action@v1
        with:
          username: ${{ github.repository_owner }}
          token: ${{ secrets.PERSONAL_TOKEN }}
          output-path: assets/github-streak-stats.svg
          background: "ffffff"
          stroke: "d4d4d4"
          ring: "2a2a2a"
          fire: "0a0a0a"
          currStreakNum: "0a0a0a"
          sideNums: "2a2a2a"
          currStreakLabel: "2a2a2a"
          sideLabels: "6b6b6b"
          dates: "6b6b6b"
          hide-border: false

      # 4. Clone github-readme-stats, run locally, and generate cards
      - name: Checkout github-readme-stats
        uses: actions/checkout@v4
        with:
          repository: anuraghazra/github-readme-stats
          path: temp-github-readme-stats

      - name: Install & Run local github-readme-stats
        run: |
          cd temp-github-readme-stats
          npm install
          PORT=9000 PAT_1=${{ secrets.PERSONAL_TOKEN }} node express.js &
          sleep 10
        shell: bash

      - name: Download Stats and Languages SVGs
        run: |
          # Dark mode versions
          curl "http://localhost:9000/api?username=${{ github.repository_owner }}&show_icons=true&hide_border=false&bg_color=0a0a0a&title_color=d4d4d4&icon_color=6b6b6b&text_color=a0a0a0&border_color=3a3a3a&rank_icon=github&hide=contribs" -o assets/github-readme-stats-dark.svg
          curl "http://localhost:9000/api/top-langs/?username=${{ github.repository_owner }}&layout=pie&langs_count=10&hide_border=false&bg_color=0a0a0a&title_color=d4d4d4&text_color=a0a0a0&border_color=3a3a3a&card_width=350&count_private=true" -o assets/github-top-langs-dark.svg
          # Light mode versions
          curl "http://localhost:9000/api?username=${{ github.repository_owner }}&show_icons=true&hide_border=false&bg_color=ffffff&title_color=0a0a0a&icon_color=6b6b6b&text_color=2a2a2a&border_color=d4d4d4&rank_icon=github&hide=contribs" -o assets/github-readme-stats.svg
          curl "http://localhost:9000/api/top-langs/?username=${{ github.repository_owner }}&layout=pie&langs_count=10&hide_border=false&bg_color=ffffff&title_color=0a0a0a&text_color=2a2a2a&border_color=d4d4d4&card_width=350&count_private=true" -o assets/github-top-langs.svg
        shell: bash

      # 5. Apply Monochrome Palette & Layout Fixes
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply Monochrome Post-processing
        run: python .github/scripts/postprocess_svgs.py

      # 6. Commit and Push directly to main
      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(automated): update snake and stats SVGs [skip ci]"
            git push origin main
          fi
