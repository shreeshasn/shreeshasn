<svg xmlns="http://www.w3.org/2000/svg" width="400" height="180" viewBox="0 0 400 180" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f5f5" />
    </linearGradient>
    
    <!-- Border Gradient: Light Grey to Medium Grey -->
    <linearGradient id="border-grad-vox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4d4d4" />
      <stop offset="100%" stop-color="#6b6b6b" />
    </linearGradient>
    
    <!-- Title Text Gradient -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a0a0a" />
      <stop offset="100%" stop-color="#2a2a2a" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Card Body -->
  <rect x="2" y="2" width="396" height="176" rx="14" fill="url(#bg-grad)" stroke="url(#border-grad-vox)" stroke-width="2" filter="url(#shadow)" />

  <!-- Title -->
  <g transform="translate(24, 18)">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="url(#title-grad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
      <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
      <line x1="12" x2="12" y1="19" y2="22"/>
    </svg>
  </g>
  <text x="48" y="33" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="url(#title-grad)">VoxGlobal AI</text>

  <!-- Status / Role Badge -->
  <rect x="275" y="16" width="101" height="22" rx="11" fill="#f0f0f0" stroke="#a0a0a0" stroke-width="1" />
  <text x="325.5" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#2a2a2a" text-anchor="middle">WIP · Team Lead</text>

  <!-- Separator line -->
  <line x1="24" y1="52" x2="376" y2="52" stroke="#e0e0e0" stroke-width="1" />

  <!-- Description -->
  <foreignObject x="24" y="64" width="352" height="60">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: system-ui, -apple-system, sans-serif; font-size: 13px; color: #6b6b6b; line-height: 1.5; font-weight: 400; margin: 0; padding: 0;">
      AI cinematic dubbing platform. Redis Streams pub/sub, pgvector speaker biometrics, CI/CD monorepo.
    </div>
  </foreignObject>

  <!-- Tech Stack Badges -->
  <g transform="translate(0, 136)">
    <!-- FastAPI -->
    <rect x="24" y="0" width="58" height="20" rx="6" fill="#f0f0f0" stroke="#d4d4d4" stroke-width="1" />
    <text x="53" y="14" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#2a2a2a" text-anchor="middle">FastAPI</text>

    <!-- Next.js -->
    <rect x="90" y="0" width="58" height="20" rx="6" fill="#f0f0f0" stroke="#d4d4d4" stroke-width="1" />
    <text x="119" y="14" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#2a2a2a" text-anchor="middle">Next.js</text>

    <!-- Redis -->
    <rect x="156" y="0" width="48" height="20" rx="6" fill="#f0f0f0" stroke="#d4d4d4" stroke-width="1" />
    <text x="180" y="14" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#2a2a2a" text-anchor="middle">Redis</text>

    <!-- PostgreSQL -->
    <rect x="212" y="0" width="80" height="20" rx="6" fill="#f0f0f0" stroke="#d4d4d4" stroke-width="1" />
    <text x="252" y="14" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#2a2a2a" text-anchor="middle">PostgreSQL</text>

    <!-- Docker -->
    <rect x="300" y="0" width="54" height="20" rx="6" fill="#f0f0f0" stroke="#d4d4d4" stroke-width="1" />
    <text x="327" y="14" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#2a2a2a" text-anchor="middle">Docker</text>
  </g>
</svg>
